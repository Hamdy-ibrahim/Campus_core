
openapi: 3.0.0

info:
  title: CampusCore FitCoach Integration API
  version: 1.0.0
  description: >
    API for integrating CampusCore with FitCoach.
    Protected endpoints require a valid X-API-Key header.

servers:
  - url: http://localhost:5000
    description: Local development server

security:
  - ApiKeyAuth: []

paths:
  /fitcoach-users/{fitcoach_userId}/profile:
    get:
      summary: Get a FitCoach user's CampusCore profile
      operationId: getFitCoachUserProfile
      parameters:
        - name: fitcoach_userId
          in: path
          required: true
          description: FitCoach user identifier
          schema:
            type: string
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Internal server error

  /fitcoach-users/{fitcoach_userId}/fitcoach-bindings:
    post:
      summary: Create a FitCoach binding for a user
      operationId: createFitCoachBinding
      parameters:
        - name: fitcoach_userId
          in: path
          required: true
          description: FitCoach user identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: FitCoach binding created successfully
        '201':
          description: FitCoach binding created
        '400':
          description: Invalid request body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Internal server error

  /events:
    get:
      summary: Get campus events
      operationId: getEvents
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Internal server error

  /clubs:
    get:
      summary: Get campus clubs
      operationId: getClubs
      responses:
        '200':
          description: Clubs retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Internal server error

  /announcements:
    get:
      summary: Get campus announcements
      operationId: getAnnouncements
      responses:
        '200':
          description: Announcements retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Internal server error

  /marketplace/listings:
    get:
      summary: Get marketplace listings
      operationId: getMarketplaceListings
      parameters:
        - name: status
          in: query
          required: true
          description: Listing status to retrieve
          schema:
            type: string
            enum:
              - active
      responses:
        '200':
          description: Marketplace listings retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '400':
          description: Missing or invalid status parameter
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Internal server error

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        API key issued to an authorized consumer.
        Never put a real API key in this file.

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Unauthorized
              message:
                type: string
                example: A valid X-API-Key header is required

    RateLimited:
      description: Too many requests within the configured rate-limit window
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Too Many Requests
              message:
                type: string
                example: Rate limit exceeded. Please try again later.
